<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Push-Up Boss Slayer - FIXED</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        body{background:#1a1a2e;color:#fff;display:flex;justify-content:center;padding:10px}
       .game-container{max-width:500px;width:100%;background:#16213e;padding:15px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.5);text-align:center}
        header{border-bottom:2px solid #0f3460;padding-bottom:12px;margin-bottom:15px}
       .stats{margin:8px 0;font-size:.95em;line-height:1.4}
       .boss-card{background:#0f3460;padding:15px;border-radius:10px;margin:12px 0}
       .boss-avatar{font-size:65px;margin:10px 0;animation:bounce 2s infinite}
        @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
       .hp-bar-container{position:relative;width:100%;height:26px;background:#444;border-radius:13px;overflow:hidden;margin:12px 0}
       .hp-bar-fill{height:100%;background:#e94560;transition:width.2s}
       .hp-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-weight:bold;font-size:.85em;text-shadow:1px 1px 2px #000}
        button{cursor:pointer;border:none;border-radius:6px;font-weight:bold;transition:transform.1s}
        button:active{transform:scale(.95)}button:disabled{opacity:.4;cursor:not-allowed}
       .btn-action{background:#00b4d8;color:#fff;padding:12px 20px;font-size:1em;width:100%;border-radius:8px}
       .btn-small{background:#533483;color:#fff;padding:8px 12px;font-size:.85em}
       .boss-selector{display:flex;justify-content:space-between;align-items:center}
       .camera-box{background:#0f3460;padding:12px;border-radius:10px;margin-top:12px}
        canvas{border-radius:8px;background:#000;width:100%;max-width:320px;height:auto}
       .status-text{margin-top:10px;font-size:1em;font-weight:bold}
       .shop-section,.leaderboard-section{margin-top:20px;background:#0f3460;padding:12px;border-radius:10px}
       .shop-item{display:flex;justify-content:space-between;align-items:center;background:#16213e;padding:10px;margin:8px 0;border-radius:6px;text-align:left;font-size:.9em}
    </style>
</head>
<body>
<div class="game-container">
<header>
<h1>🏋️ AI Push-Up Boss Slayer</h1>
<div class="stats">
<p>💎 Gemme: <span id="gems">0</span></p>
<p>📅 Giorni: <span id="days">1</span></p>
<p>🗡️ Arma: <span id="weapon-name">Coltello</span> (<span id="weapon-damage">1</span>)</p>
</div>
<button id="btn-next-day" class="btn-action" style="margin-top:5px">☀️ Giorno Successivo</button>
</header>

<div class="boss-selector">
<button id="btn-prev-boss" class="btn-small">⬅️ Prec.</button>
<span id="boss-level-display" style="font-weight:bold">Boss #1</span>
<button id="btn-next-boss" class="btn-small">Succ. ➡️</button>
</div>
<div class="boss-card">
<h2 id="boss-name">Goblin</h2>
<div class="boss-avatar" id="boss-avatar">👺</div>
<div class="hp-bar-container"><div class="hp-bar-fill" id="hp-bar"></div><span id="hp-text" class="hp-text">10 / 10</span></div>
<p>Ricompensa: <span id="boss-gems-reward">5</span> 💎</p>
</div>

<div class="camera-box">
<button id="btn-start-cam" class="btn-action" style="background:#e94560">📷 Attiva Fotocamera</button>
<video id="webcam" playsinline style="display:none"></video>
<canvas id="output_canvas" width="320" height="240" style="display:none;margin:10px auto"></canvas>
<p class="status-text">Stato: <span id="pushup-status" style="color:#00b4d8">Pronto</span></p>
</div>

<section class="shop-section"><h2>🛒 Negozio</h2><div id="shop-list"></div></section>
</div>

<script>
const BOSSES=[
{id:1,name:"Goblin Allenatore",hp:10,gems:5,icon:"👺"},{id:2,name:"Orco Warm-up",hp:25,gems:12,icon:"👹"},
{id:3,name:"Scheletro Flessore",hp:60,gems:30,icon:"💀"},{id:4,name:"Minotauro Panca",hp:150,gems:75,icon:"🐂"},
{id:5,name:"Golem",hp:400,gems:200,icon:"🗿"},{id:6,name:"Idra Flessioni",hp:1000,gems:500,icon:"🐍"},
{id:7,name:"Demone Cardio",hp:3000,gems:1500,icon:"👿"},{id:18,name:"RE DEI 3 TRILIONI",hp:3000000000000,gems:1000000000000,icon:"👑"}
];
const WEAPONS=[
{id:1,name:"Coltello di Legno",damage:1,cost:0},{id:2,name:"Pugnale di Ferro",damage:3,cost:15},
{id:3,name:"Spada Acciaio",damage:10,cost:100},{id:4,name:"Spada d'Oro",damage:35,cost:500},
{id:5,name:"Diamante",damage:120,cost:2500},{id:6,name:"Alabarda Mitica",damage:500,cost:12000}
];
let state={gems:0,days:1,currentWeaponIndex:0,currentBossIndex:0,unlockedBossIndex:0,bossHp:BOSSES[0].hp};
let stage="UP"; let pose,camera;

function formatNumber(n){
if(n>=1e12) return (n/1e12).toFixed(2)+" T";
if(n>=1e9) return (n/1e9).toFixed(2)+" B";
if(n>=1e6) return (n/1e6).toFixed(2)+" M";
if(n>=1e3) return (n/1e3).toFixed(1)+" K";
return Math.floor(n).toString();
}
function saveGame(){localStorage.setItem('pushupGameSave',JSON.stringify(state))}
function loadGame(){let s=localStorage.getItem('pushupGameSave'); if(s) state=JSON.parse(s)}

function updateUI(){
let boss=BOSSES[state.currentBossIndex]; let weapon=WEAPONS[state.currentWeaponIndex];
document.getElementById('gems').innerText=formatNumber(state.gems);
document.getElementById('days').innerText=state.days;
document.getElementById('weapon-name').innerText=weapon.name;
document.getElementById('weapon-damage').innerText=formatNumber(weapon.damage);
document.getElementById('boss-level-display').innerText=`Boss ${boss.id}/${BOSSES.length}`;
document.getElementById('boss-name').innerText=boss.name;
document.getElementById('boss-avatar').innerText=boss.icon;
document.getElementById('boss-gems-reward').innerText=formatNumber(boss.gems);
let pct=Math.max(0,(state.bossHp/boss.hp)*100);
document.getElementById('hp-bar').style.width=pct+'%';
document.getElementById('hp-text').innerText=`${formatNumber(state.bossHp)} / ${formatNumber(boss.hp)}`;
document.getElementById('btn-prev-boss').disabled=state.currentBossIndex===0;
document.getElementById('btn-next-boss').disabled=state.currentBossIndex>=state.unlockedBossIndex;
renderShop(); saveGame();
}
function calculateAngle(A,B,C){
let rad=Math.atan2(C.y-B.y,C.x-B.x)-Math.atan2(A.y-B.y,A.x-B.x);
let ang=Math.abs(rad*180/Math.PI); if(ang>180) ang=360-ang; return ang;
}
function onResults(results){
let canvas=document.getElementById('output_canvas'); let ctx=canvas.getContext('2d');
ctx.save(); ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(results.image,0,0,canvas.width,canvas.height);
if(results.poseLandmarks){
 let lm=results.poseLandmarks;
 let leftAngle=calculateAngle(lm[11],lm[13],lm[15]);
 let rightAngle=calculateAngle(lm[12],lm[14],lm[16]);
 let angle=Math.min(leftAngle,rightAngle); // più severo, anti-cheat

 if(angle < 90 && stage==="UP"){
   stage="DOWN";
   document.getElementById('pushup-status').innerText="⬇️ GIU' - Ora spingi!";
   document.getElementById('pushup-status').style.color="#ffd166";
 }
 if(angle > 160 && stage==="DOWN"){
   stage="UP";
   document.getElementById('pushup-status').innerText="✅ VALIDO!";
   document.getElementById('pushup-status').style.color="#06d6a0";
   doPushupDamage();
 }
}
ctx.restore();
}
function doPushupDamage(){
let weapon=WEAPONS[state.currentWeaponIndex];
state.bossHp-=weapon.damage;
if(state.bossHp<=0){
 let boss=BOSSES[state.currentBossIndex];
 state.gems+=boss.gems;
 if(state.currentBossIndex===state.unlockedBossIndex && state.unlockedBossIndex<BOSSES.length-1){
   state.unlockedBossIndex++; state.currentBossIndex++;
 }
 state.bossHp=BOSSES[state.currentBossIndex].hp;
}
updateUI();
}
document.getElementById('btn-start-cam').addEventListener('click', async()=>{
let video=document.getElementById('webcam'); let canvas=document.getElementById('output_canvas');
let status=document.getElementById('pushup-status');
status.innerText="Caricamento AI...";
try{
 pose=new Pose({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
 pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:0.6,minTrackingConfidence:0.6});
 pose.onResults(onResults);
 camera=new Camera(video,{onFrame:async()=>{await pose.send({image:video})},width:640,height:480});
 await camera.start();
 document.getElementById('btn-start-cam').style.display='none';
 canvas.style.display='block';
 status.innerText="Attiva! Fai una flessione completa";
}catch(e){
 status.innerText="ERRORE: Usa HTTPS e dai permesso fotocamera";
 alert(e.message);
}
});
document.getElementById('btn-next-day').onclick=()=>{state.days++;updateUI()};
document.getElementById('btn-prev-boss').onclick=()=>{if(state.currentBossIndex>0){state.currentBossIndex--;state.bossHp=BOSSES[state.currentBossIndex].hp;updateUI()}};
document.getElementById('btn-next-boss').onclick=()=>
